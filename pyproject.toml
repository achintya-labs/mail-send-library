[project]
name = "email_sender"
version = "0.1.0"
description = "Unified Gmail and ZeptoMail package"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "google-api-python-client==2.171.0",
    "google-auth==2.40.3",
    "google-auth-oauthlib>=1.2.0",
    "requests==2.32.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mailpkg*"]